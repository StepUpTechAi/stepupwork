name: ci
on:
  push:
  pull_request:
  workflow_call:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/stepupwork
      - run: claude plugin test plugins/stepupwork
      - run: npm run check
      - run: npm test
